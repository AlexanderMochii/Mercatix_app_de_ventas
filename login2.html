<body>
  <!-- NAVBAR ESTILO MERCATIX -->
   <nav class="navbar navbar-expand-lg mercatix-navbar">
  <div class="container-fluid">
    <a class="navbar-brand text-green" href="index.html">Mercatix</a>
    <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="login.html">Crear cuenta</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

  <!-- CONTENIDO -->
  <main class="container my-5" style="max-width: 400px;">
    <h2 class="mb-4 text-center">Iniciar Sesión</h2>
    <form>
      <div class="mb-3">
        <label for="usuario" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="usuario" placeholder="Ingresa tu usuario" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <div class="text-center mt-3">
      <small>¿No tienes una cuenta? <a href="login.html">Regístrate</a></small>
    </div>

    <hr class="my-4" />

    <div class="text-center">
      <p>O inicia sesión con:</p>
      <div class="social-buttons-container">
        <button class="social-btn google" type="button" aria-label="Iniciar sesión con Google">
          <i class="bi bi-google fs-4"></i>
        </button>
        <button class="social-btn facebook" type="button" aria-label="Iniciar sesión con Facebook">
          <i class="bi bi-facebook fs-4"></i>
        </button>
        <button class="social-btn instagram" type="button" aria-label="Iniciar sesión con Instagram">
          <i class="bi bi-instagram fs-4"></i>
        </button>
      </div>
    </div>
  </main>
